name: Build production APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - name: Check build configuration
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Set the EXPO_TOKEN repository secret before building."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "Set the EXPO_PUBLIC_API_URL repository variable before building."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Lint
        run: npx expo lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Start EAS production APK build
        run: npx eas-cli@latest build --profile production-apk --platform android --non-interactive --no-wait
