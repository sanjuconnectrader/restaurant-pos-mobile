name: Check EAS build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build ID
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: ${{ inputs.build_id }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for build result
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            builds_json="$(eas build:list --limit 20 --json --non-interactive)"
            build_json="$(printf '%s' "$builds_json" | jq --arg build_id "$BUILD_ID" 'map(select(.id == $build_id))[0]')"
            if [ "$build_json" = "null" ]; then
              echo "EAS build $BUILD_ID was not found for this project."
              exit 1
            fi
            build_status="$(printf '%s' "$build_json" | jq -r '.status' | tr '[:lower:]-' '[:upper:]_')"
            echo "EAS build status: $build_status"

            if [ "$build_status" = "FINISHED" ]; then
              printf '%s' "$build_json" | jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl // "Build completed without an artifact URL."'
              exit 0
            fi

            if [ "$build_status" = "ERRORED" ] || [ "$build_status" = "CANCELED" ]; then
              printf '%s' "$build_json" | jq -r '.error.message // "EAS build did not complete successfully."'
              exit 1
            fi

            sleep 30
          done

          echo "Timed out waiting for EAS build."
          exit 1
