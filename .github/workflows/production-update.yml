name: Publish Android production update

on:
  push:
    branches:
      - production

concurrency:
  group: production-eas-update
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - name: Check update credentials and API URL
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Set the EXPO_TOKEN repository secret before publishing updates."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "Set the EXPO_PUBLIC_API_URL repository variable before publishing updates."
            exit 1
          fi
          if [[ ! "$EXPO_PUBLIC_API_URL" =~ ^https?://.+/api/?$ ]]; then
            echo "EXPO_PUBLIC_API_URL must be a reachable HTTP(S) URL ending in /api."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject native or build configuration changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          if printf '%s\n' "$changed_files" | grep -Eq '^(app\.json|eas\.json|package\.json|package-lock\.json|android/|ios/)'; then
            echo "Native dependencies or build configuration changed. Create a new APK instead of publishing an over-the-air update."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Lint
        run: npx expo lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Publish Android update
        run: npx eas-cli@latest update --channel production --platform android --message "$GITHUB_SHA" --non-interactive
